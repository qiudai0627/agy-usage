name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run smoke tests & DOM integrity checks
        run: ./verify.sh
      - name: Run privacy gate & release packaging check
        run: ./scripts/package-release.sh /tmp/agy-usage-release.zip
