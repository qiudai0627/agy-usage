name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full isolated test suite & DOM checks
        run: ./verify.sh
      - name: Run privacy gate & release packaging check
        run: ./scripts/package-release.sh /tmp/agy-usage-release.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated verification suite
        run: ./verify.sh
      - name: Compile native macOS MenuBarApp.swift
        run: AGY_APP_DIR=/tmp/agy-app-out ./macos/build-app.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify PowerShell 5.1 AST parsing & UTF-8 BOM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in @("install.ps1", "uninstall.ps1")) {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "$f missing UTF-8 BOM for Windows PowerShell 5.1"
            }
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in ${f}: $($errors | Out-String)"
            }
          }
      - name: Run isolated unit & NTFS concurrency tests
        run: python tests/test_suite.py
