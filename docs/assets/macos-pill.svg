<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" width="640" height="258">
  <rect width="640" height="258" rx="12" fill="#0b1220" stroke="#24324d"/>
  <!-- Simulated Mac top menu bar -->
  <rect width="640" height="28" rx="0" fill="#161f33"/>
  <rect x="220" y="0" width="120" height="22" rx="6" fill="#05070c"/>
  <text x="280" y="15" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9.5">MacBook 刘海区</text>
  <text x="620" y="18" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="11"><tspan fill="#fbbf24">●</tspan><tspan fill="#38bdf8" font-weight="700">G</tspan><tspan fill="#fbbf24">57</tspan><tspan fill="#64748b">│</tspan><tspan fill="#a78bfa" font-weight="700">C</tspan><tspan fill="#fb7185">88%</tspan>   Wi-Fi  14:30</text>

  <!-- Floating Notch-Proof Colored Glass Pill -->
  <rect x="444" y="36" width="176" height="28" rx="14" fill="#111827" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2"/>
  <text x="532" y="54" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700"><tspan fill="#fb7185">● </tspan><tspan fill="#38bdf8">G </tspan><tspan fill="#fbbf24">57%</tspan><tspan fill="#64748b"> │ </tspan><tspan fill="#a78bfa">C </tspan><tspan fill="#fb7185">88%</tspan></text>
  <text x="430" y="54" text-anchor="end" fill="#38bdf8" font-family="sans-serif" font-size="11">单击胶囊展开菜单 →</text>

  <!-- Dropdown Menu with reset countdowns & version/check-update -->
  <rect x="316" y="70" width="304" height="176" rx="10" fill="#162033" stroke="#2d3f5e"/>
  <text x="332" y="90" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="700">Antigravity 实时监控（演示）</text>
  <text x="332" y="109" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="600">▸ Google Gemini 池</text>
  <text x="340" y="124" fill="#e2e8f0" font-family="monospace" font-size="10">当前5h  <tspan fill="#34d399">█░░░░░░░ 12.7%</tspan><tspan fill="#94a3b8"> (2h45m)</tspan></text>
  <text x="340" y="139" fill="#e2e8f0" font-family="monospace" font-size="10">每周7d  <tspan fill="#fbbf24">█████░░░ 56.9%</tspan><tspan fill="#94a3b8"> (12-03)</tspan></text>
  <text x="332" y="158" fill="#a78bfa" font-family="sans-serif" font-size="10.5" font-weight="600">▸ Claude / GPT 池</text>
  <text x="340" y="173" fill="#e2e8f0" font-family="monospace" font-size="10">当前5h  <tspan fill="#34d399">░░░░░░░░  0.0%</tspan></text>
  <text x="340" y="188" fill="#e2e8f0" font-family="monospace" font-size="10">每周7d  <tspan fill="#fb7185">███████░ 87.5%</tspan><tspan fill="#94a3b8"> (12-02)</tspan></text>
  <line x1="330" y1="198" x2="606" y2="198" stroke="#2d3f5e"/>
  <text x="332" y="214" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="600">打开完整 Web 监控台  ⌘O</text>
  <text x="332" y="233" fill="#64748b" font-family="sans-serif" font-size="10">AGY Usage v1.5.1 · <tspan fill="#94a3b8">检查更新…</tspan></text>

  <!-- Left callout -->
  <text x="24" y="96" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">macOS 彩色悬浮胶囊 + 顶栏</text>
  <text x="24" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">• G 青 / C 紫池标 + 绿黄红阈值色</text>
  <text x="24" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">• 四桶进度条 + 实时重置倒计时</text>
  <text x="24" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">• 支持浅色 / 通透 / 深色 / 跟随系统</text>
  <text x="24" y="178" fill="#94a3b8" font-family="sans-serif" font-size="11">• 内置版本显示与手动检查更新</text>
</svg>
