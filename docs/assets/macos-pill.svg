<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <rect width="640" height="240" rx="12" fill="#0b1220" stroke="#24324d"/>
  <!-- Simulated Mac top menu bar (compact colored G15│C62%) -->
  <rect width="640" height="28" rx="0" fill="#161f33"/>
  <rect x="220" y="0" width="120" height="22" rx="6" fill="#05070c"/>
  <text x="280" y="15" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9.5">MacBook 刘海区</text>
  <text x="620" y="18" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="11"><tspan fill="#fbbf24">●</tspan><tspan fill="#38bdf8" font-weight="700">G</tspan><tspan fill="#34d399">15</tspan><tspan fill="#64748b">│</tspan><tspan fill="#a78bfa" font-weight="700">C</tspan><tspan fill="#fbbf24">62%</tspan>   Wi-Fi  14:30</text>

  <!-- Floating Notch-Proof Colored Glass Pill -->
  <rect x="444" y="36" width="176" height="28" rx="14" fill="#111827" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.2"/>
  <text x="532" y="54" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700"><tspan fill="#fbbf24">● </tspan><tspan fill="#38bdf8">G </tspan><tspan fill="#34d399">15%</tspan><tspan fill="#64748b"> │ </tspan><tspan fill="#a78bfa">C </tspan><tspan fill="#fbbf24">62%</tspan></text>
  <text x="430" y="54" text-anchor="end" fill="#38bdf8" font-family="sans-serif" font-size="11">单击胶囊展开菜单 →</text>

  <!-- Dropdown Menu with pool identity + threshold colors -->
  <rect x="330" y="70" width="290" height="156" rx="10" fill="#162033" stroke="#2d3f5e"/>
  <text x="346" y="92" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="700">Antigravity 实时监控（演示）</text>
  <text x="346" y="112" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="600">▸ Google Gemini 池</text>
  <text x="354" y="128" fill="#e2e8f0" font-family="monospace" font-size="10.5">当前5h  <tspan fill="#34d399">██░░░░░░  已用 18.0%</tspan></text>
  <text x="354" y="143" fill="#e2e8f0" font-family="monospace" font-size="10.5">每周7d  <tspan fill="#34d399">█░░░░░░░  已用 15.0%</tspan></text>
  <text x="346" y="163" fill="#a78bfa" font-family="sans-serif" font-size="10.5" font-weight="600">▸ Claude / GPT 池</text>
  <text x="354" y="179" fill="#e2e8f0" font-family="monospace" font-size="10.5">当前5h  <tspan fill="#34d399">██░░░░░░  已用 24.0%</tspan></text>
  <text x="354" y="194" fill="#e2e8f0" font-family="monospace" font-size="10.5">每周7d  <tspan fill="#fbbf24">█████░░░  已用 62.0%</tspan></text>
  <text x="346" y="216" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">打开完整 Web 监控台  ⌘O</text>

  <!-- Left callout -->
  <text x="24" y="96" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">macOS 彩色悬浮胶囊 + 顶栏</text>
  <text x="24" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">• G 青 / C 紫池标 + 绿黄红已用阈值色</text>
  <text x="24" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">• 支持浅色 / 通透 / 深色 / 跟随系统</text>
  <text x="24" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">• 停靠菜单栏正下方，避开刘海遮挡</text>
</svg>
