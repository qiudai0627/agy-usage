<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240">
  <rect width="640" height="240" rx="12" fill="#0b1220" stroke="#24324d"/>
  <!-- Simulated Mac top menu bar -->
  <rect width="640" height="28" rx="0" fill="#161f33"/>
  <rect x="220" y="0" width="120" height="22" rx="6" fill="#05070c"/>
  <text x="280" y="15" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="9.5">MacBook 刘海区</text>
  <text x="620" y="18" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="11">●15│62%   Wi-Fi  14:30</text>

  <!-- Floating Notch-Proof Pill -->
  <rect x="444" y="36" width="176" height="28" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="532" y="54" text-anchor="middle" fill="#f8fafc" font-family="monospace" font-size="11.5" font-weight="700">● G 15% │ C 62%</text>
  <text x="430" y="54" text-anchor="end" fill="#38bdf8" font-family="sans-serif" font-size="11">单击胶囊展开菜单 →</text>

  <!-- Dropdown Menu -->
  <rect x="330" y="70" width="290" height="156" rx="10" fill="#162033" stroke="#2d3f5e"/>
  <text x="346" y="92" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="700">Antigravity 实时监控（演示）</text>
  <text x="346" y="112" fill="#94a3b8" font-family="sans-serif" font-size="10.5">▸ Google Gemini 池</text>
  <text x="354" y="128" fill="#e2e8f0" font-family="monospace" font-size="10.5">当前5h  ██░░░░░░  已用 18.0%</text>
  <text x="354" y="143" fill="#e2e8f0" font-family="monospace" font-size="10.5">每周7d  █░░░░░░░  已用 15.0%</text>
  <text x="346" y="163" fill="#94a3b8" font-family="sans-serif" font-size="10.5">▸ Claude / GPT 池</text>
  <text x="354" y="179" fill="#e2e8f0" font-family="monospace" font-size="10.5">当前5h  ██░░░░░░  已用 24.0%</text>
  <text x="354" y="194" fill="#fbbf24" font-family="monospace" font-size="10.5">每周7d  █████░░░  已用 62.0%</text>
  <text x="346" y="216" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">打开完整 Web 监控台  ⌘O</text>

  <!-- Left callout -->
  <text x="24" y="96" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">macOS 右上角悬浮胶囊</text>
  <text x="24" y="118" fill="#94a3b8" font-family="sans-serif" font-size="11">• 停靠在菜单栏正下方，避开刘海遮挡</text>
  <text x="24" y="138" fill="#94a3b8" font-family="sans-serif" font-size="11">• 按住可随意拖动位置，单击看四格进度</text>
  <text x="24" y="158" fill="#94a3b8" font-family="sans-serif" font-size="11">• 大屏用户可在菜单里一键隐藏胶囊</text>
</svg>
